name: quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p artifacts/quality/browser && node --test --test-reporter=junit --test-reporter-destination=artifacts/quality/browser/browser.xml tests/browser/*.test.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: artifacts/quality/browser/
          if-no-files-found: error
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python dependencies
        run: python -m pip install -r requirements-quality.txt
      - name: Linux PNG dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpng-dev
      - name: macOS PNG dependency
        if: runner.os == 'macOS'
        run: brew install libpng
      - name: Windows PNG dependency
        if: runner.os == 'Windows'
        run: vcpkg install libpng:x64-windows
      - name: Configure POSIX C++23
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSOFTLOAF_DESKTOP=OFF -DSOFTLOAF_RAWTHERAPEE=OFF
      - name: Configure Windows C++23
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DSOFTLOAF_DESKTOP=OFF -DSOFTLOAF_RAWTHERAPEE=OFF
      - name: Build native code
        run: cmake --build build --config Release --parallel 4
      - name: Run declared public checks
        env:
          SOFTLOAF_CORE: ${{ github.workspace }}/build/Release/softloaf_core.dll
        shell: bash
        run: |
          if [ "$RUNNER_OS" != Windows ]; then unset SOFTLOAF_CORE; fi
          python scripts/run_checks.py --profile public
      - name: Retain reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.os }}
          path: artifacts/quality/latest/
          if-no-files-found: error
          retention-days: 14
